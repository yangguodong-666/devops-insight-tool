name: Day15 CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  
jobs:
  lint:
    runs-on: ubuntu-lastest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      - name: Run lint
        run: flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
  test:
    runs-on: ubuntu-lastest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test script
        run: python scripts/hello_ci.py